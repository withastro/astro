name: Continuous benchmark

on:
  workflow_dispatch:
  pull_request: 
    branches:
      - main
    paths:
      - 'packages/astro/src/**/*.ts'
      - 'benchmark/**'
  push:
    branches:
      - main
    paths:
      - 'packages/astro/src/**/*.ts'
      - 'benchmark/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  FORCE_COLOR: true
  CODSPEED: true

jobs:
  codspeed:
    if: ${{ github.repository_owner == 'withastro' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [ "1/4", "2/4", "3/4", "4/4" ]
    permissions:
      contents: read # Checkout only
      pull-requests: write # CodSpeed posts benchmark results as PR comment
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
        
      - name: Setup benchmark projects
        working-directory: ./benchmark
        run: pnpm run build:bench
        timeout-minutes: 15
        
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        timeout-minutes: 30
        with:
          working-directory: ./benchmark
          run: pnpm bench --shard=${{ matrix.shard }}
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
