name: Continuous benchmark

on:
  workflow_dispatch:
  pull_request: 
    branches:
      - main
    paths:
      - 'packages/astro/src/**/*.ts'
      - 'benchmark/**'
  push:
    branches:
      - main
    paths:
      - 'packages/astro/src/**/*.ts'
      - 'benchmark/**'

permissions: {}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  FORCE_COLOR: true
  CODSPEED: true

jobs:
  codspeed:
    if: ${{ github.repository_owner == 'withastro' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [ "1/4", "2/4", "3/4", "4/4" ]
    permissions:
      contents: read # Checkout only
      pull-requests: write # CodSpeed posts benchmark results as PR comment
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
        
      - name: Setup benchmark projects
        working-directory: ./benchmark
        run: pnpm run build:bench
        timeout-minutes: 15
        
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        timeout-minutes: 30
        with:
          working-directory: ./benchmark
          run: pnpm bench --shard=${{ matrix.shard }}
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
