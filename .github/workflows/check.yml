name: Examples astro check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  merge_group:
  pull_request:
    # `astro check` type-checks the examples against Astro's emitted types, which are assembled
    # from across `src` (assets, content, and more) rather than a single public entry point.
    # Trigger on all of `src` and the shipped ambient declarations so type regressions that only
    # surface in the examples are caught here instead of on `main`.
    paths:
      - "examples/**"
      - ".github/workflows/check.yml"
      - "scripts/smoke/check.js"
      - "packages/astro/src/**"
      - "packages/astro/*.d.ts"
      - "pnpm-lock.yaml"

permissions: {}

env:
  ASTRO_TELEMETRY_DISABLED: true
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  FORCE_COLOR: true

jobs:
  check:
    name: astro check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout only
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Status
        run: git status

      - name: astro check
        run: pnpm run test:check-examples
