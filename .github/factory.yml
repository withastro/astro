version: 1

review:
  trigger:
    label: "pr: astro-review"
  skill: .agents/skills/astro-code-review
  severity: [critical, high, medium, low, optional]
  areas:
    - design
    - correctness
    - security
    - runtime
    - completeness
    - error-handling
    - tests
    - maintainability
    - documentation
    - changeset

# Review only for now. Triage is enabled by default, so it has to be
# switched off explicitly.
triage:
  enabled: false
